<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Outer ring -->
  <circle cx="32" cy="32" r="30" fill="none" stroke="url(#grad)" stroke-width="4"/>
  <!-- Middle ring -->
  <circle cx="32" cy="32" r="20" fill="none" stroke="url(#grad)" stroke-width="3"/>
  <!-- Inner ring -->
  <circle cx="32" cy="32" r="12" fill="none" stroke="url(#grad)" stroke-width="2"/>
  <!-- Center dot -->
  <circle cx="32" cy="32" r="4" fill="url(#grad)"/>
</svg>