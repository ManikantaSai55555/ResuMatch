version: "3.9"

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
  frontend:
    build: ./resumatcher-frontend
    ports:
      - "3000:80"
    # environment:
    #   - PORT=3000
    volumes:
      - ./resumatcher-frontend:/app
    depends_on:
      - backend
    # command: sh -c "npm install && npm run dev -- --host